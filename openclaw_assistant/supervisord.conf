[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
; Avoid surprises with signal delivery in containers:
; supervisord itself will still stop on SIGTERM/SIGINT from Docker/K8s.

[program:init]
command=/init.sh
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Common “don’t lose signals / don’t orphan children” knobs ---
; stopasgroup/killasgroup make supervisor signal the whole process group
; (critical if your scripts spawn daemons or multiple children).

[program:openclaw]
command=/start-openclaw.sh
autostart=false
autorestart=unexpected
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=USR1
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:ttyd]
command=/start-ttyd.sh
autostart=false
autorestart=unexpected
startsecs=1
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true

[program:nginx]
command=/start-nginx.sh
autostart=false
autorestart=unexpected
startsecs=1
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; nginx graceful stop is QUIT, not TERM
stopsignal=QUIT
stopwaitsecs=15
stopasgroup=true
killasgroup=true

[eventlistener:cleanup]
command=/cleanup.sh
events=PROCESS_STATE_STOPPED,PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
autostart=true
autorestart=false
stdout_logfile=/dev/null
stderr_logfile=/dev/null
